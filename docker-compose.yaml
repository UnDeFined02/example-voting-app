version: "3.8"

networks:
   vote:
      driver: bridge

services:
   vote:
       image: undefined014/vote:v1
       build:
          context: ./vote
          dockerfile: Dockerfile
       ports:
         - 80
       depends_on:
         - redis
       networks:
         - vote

   result:
       image: undefined014/result:v1
       build:
          context: ./result
          dockerfile: Dockerfile
       ports:
         - 80
       depends_on:
         - db
       networks:
         - vote

   worker:
       image: undefined014/worker:v1
       build:
          context: ./worker
          dockerfile: Dockerfile  
       depends_on:
         - redis
         - db
       networks:
         - vote  

   redis:
       image: redis:6.0-alpine
       networks:
         - vote  
   
   db:
       image: postgres:18.1
       networks:
         - vote  
       environment:
         - POSTGRES_HOST_AUTH_METHOD=trust
